<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Página não encontrada | KW Importados</title>
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#111111">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
@font-face{font-family:'Montserrat';font-weight:800;font-display:swap;src:url(/fonts/montserrat-latin-800-normal.woff2) format('woff2')}
@font-face{font-family:'Montserrat';font-weight:700;font-display:swap;src:url(/fonts/montserrat-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:400 700;font-display:swap;src:url(/fonts/hanken-grotesk-latin-wght-normal.woff2) format('woff2')}
:root{--ink:#111;--text:#F5F0ED;--muted:#ABA29E;--orange:#F7861E;--orange-grad:linear-gradient(120deg,#FFB347 0%,#F7861E 48%,#E2580C 100%);color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left));background:radial-gradient(60% 50% at 70% 30%,rgba(247,134,30,.22),rgba(247,134,30,0)),var(--ink);color:var(--text);font-family:"Hanken Grotesk",system-ui,sans-serif;font-size:1.0625rem;line-height:1.6}
main{max-width:560px;display:grid;gap:22px}
a.logo{display:inline-block;width:fit-content}
a.logo img{height:40px;width:auto;display:block}
.code{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:clamp(4.5rem,18vw,8rem);line-height:.9;letter-spacing:-.05em;background:var(--orange-grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin:0}
h1{font-family:Montserrat,Arial,sans-serif;font-weight:800;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.08;letter-spacing:-.02em;text-transform:uppercase;margin:0;text-wrap:balance}
p{margin:0;color:var(--muted)}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 1.6em;border-radius:999px;font-family:Montserrat,Arial,sans-serif;font-weight:700;font-size:.86rem;letter-spacing:.08em;text-transform:uppercase;text-decoration:none;transition:transform .3s cubic-bezier(.22,1,.36,1)}
.btn--solid{background:var(--orange-grad);color:#111}
.btn--ghost{color:#FFF2E6;border:1px solid rgba(247,134,30,.62);background:rgba(247,134,30,.12)}
.btn:focus-visible{outline:2px solid #FFD3A1;outline-offset:3px}
@media (hover:hover) and (prefers-reduced-motion:no-preference){.btn:hover{transform:translateY(-3px)}}
.btn:active{transform:scale(.97)}
</style>
</head>
<body>
<main>
  <a class="logo" href="/" aria-label="KW Importados, página inicial"><img src="/img/logo.png" alt="KW Importados" width="335" height="120"></a>
  <p class="code" aria-hidden="true">404</p>
  <h1>Essa página não existe.</h1>
  <p>O link pode ter mudado ou sido digitado errado. Volte para o início ou chame a gente para fazer sua cotação.</p>
  <div class="ctas">
    <a class="btn btn--solid" href="https://wa.me/5544997578738?text=Ol%C3%A1%2C%20vim%20pelo%20site%20e%20quero%20fazer%20uma%20cota%C3%A7%C3%A3o." target="_blank" rel="noopener noreferrer">Faça sua cotação</a>
    <a class="btn btn--ghost" href="/">Voltar ao início</a>
  </div>
</main>
</body>
</html>
